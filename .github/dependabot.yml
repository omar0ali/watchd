# Weekly PRs to keep Go modules and GitHub Actions up to date.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # "fix(deps): ..." so dependency (and security) updates ship in a patch release
      prefix: fix
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci # "ci: ..." does not trigger a release
